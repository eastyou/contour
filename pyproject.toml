[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contour"
version = "0.1.0"
description = "初中地理等高线地形图读图工具：生成高程网格、绘制等高线、判读地形部位与坡度"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["contour", "geography", "education", "svg", "terrain"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Chinese (Simplified)",
    "Topic :: Education",
    "Intended Audience :: Education",
]

[project.scripts]
contour = "contour.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/contour"
Source = "https://github.com/eastyou/contour"

[tool.setuptools]
packages = ["contour"]
